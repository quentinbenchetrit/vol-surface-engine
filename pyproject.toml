[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "volsurface"
version = "0.1.0"
description = "Arbitrage-free implied volatility surface and stochastic-volatility calibration on Deribit option data"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "scipy>=1.9",
    "requests>=2.28",
    "duckdb>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
plot = ["matplotlib>=3.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
